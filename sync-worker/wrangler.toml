name = "bill-planner-sync"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Every 15 minutes, send any reminders that are due.
[triggers]
crons = ["*/15 * * * *"]

# Public half of the notification signing key (the private half is a Cloudflare secret: VAPID_PRIVATE_JWK).
[vars]
VAPID_PUBLIC = "BFm5sbs8xOWSsWH4UCisiZ3HgqaVdCP3T3Lf78DbRUrZqZO55hjrDlkQFxE0Z2IPNogL9BgPFaqKhS8_csft9Bg"
VAPID_SUBJECT = "https://jwjones35.github.io/bill-planner/"
# Live balance (Plaid). The secret half is the Cloudflare secret PLAID_SECRET.
PLAID_CLIENT_ID = "6ae7db351cceab000d2da8fd"
PLAID_HOST = "https://production.plaid.com"

[[d1_databases]]
binding = "DB"
database_name = "bill-planner-sync"
database_id = "d479704c-e14e-472a-b3de-9948ac012d3e"
